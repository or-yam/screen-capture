name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release upload or publication.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match VERSION ($version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Package universal app, DMG, and ZIP
        env:
          ARCHES: arm64 x86_64
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash Scripts/package_app.sh

      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScreenCaptureAll-${{ steps.version.outputs.version }}-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ScreenCaptureAll-${{ needs.build.outputs.version }}-universal
          path: dist

      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum -c *-SHA256SUMS.txt

      - name: Create draft with assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.dmg dist/*.zip dist/*-SHA256SUMS.txt \
            --verify-tag --draft --title "Screen Capture All $RELEASE_TAG" \
            --generate-notes --notes-file docs/RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
